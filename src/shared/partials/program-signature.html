<!--
  Firma de los programas: los vincula con Carola sin mezclar las marcas.
  `origin` viaja a /mentorias para que la aplicación lleve el tag pagina:<origin>.
-->
<div class="signature">
  <a class="signature__by" href="/">
    <span class="logo-mark" aria-hidden="true"></span>
    <span>Un programa de <strong>Carola Gando</strong></span>
  </a>
  <p class="signature__mentoring">¿Buscás un proceso personalizado? <a href="/mentorias?origen={{origin}}">Conocé sus mentorías <span aria-hidden="true">→</span></a></p>
</div>
